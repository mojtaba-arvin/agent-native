name: Generate pinned Rust dependency lockfiles

on:
  push:
    branches:
      - "research/reboot-core"
    paths:
      - "experiments/**/Cargo.toml"
      - ".github/workflows/generate-lockfiles.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Generate lockfiles with pinned Rust/Cargo
        run: |
          cargo generate-lockfile --manifest-path experiments/e001/baselines/rust/Cargo.toml
          cargo generate-lockfile --manifest-path experiments/e002/rust/Cargo.toml
          cargo generate-lockfile --manifest-path experiments/e002/wasi-p2/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-rust-lockfiles
          path: |
            experiments/e001/baselines/rust/Cargo.lock
            experiments/e002/rust/Cargo.lock
            experiments/e002/wasi-p2/Cargo.lock
          if-no-files-found: error
          retention-days: 14
