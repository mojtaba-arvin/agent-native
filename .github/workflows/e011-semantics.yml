name: E-011 transport-neutral semantics model

on:
  push:
    branches: [main, "research/**"]
    paths:
      - "experiments/e011/**"
      - ".github/workflows/e011-semantics.yml"
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
    paths:
      - "experiments/e011/**"
      - ".github/workflows/e011-semantics.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  semantics-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile E-011 semantic model
        run: python -m py_compile experiments/e011/semantics.py experiments/e011/test_semantics.py
      - name: Run deterministic E-011 semantic tests
        working-directory: experiments/e011
        run: python -m unittest -v
