name: M3 evaluator topology smoke

on:
  push:
    branches:
      - research/reboot-core
    paths:
      - ".github/workflows/m3-evaluator.yml"
      - "experiments/e007/evaluator/**"
      - "tests/test_m3_evaluator_workflow.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "Only the synthetic topology smoke is enabled; no model cohort is dispatched"
        required: true
        type: choice
        options:
          - topology-smoke
        default: topology-smoke

permissions:
  contents: read
  actions: read

concurrency:
  group: m3-evaluator-topology-${{ github.ref }}
  cancel-in-progress: false

env:
  M3_SMOKE_IMAGE: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce research-branch synthetic topology smoke only
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          MODE: ${{ inputs.mode || 'topology-smoke' }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch|push) ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          test "$REF_NAME" = "refs/heads/research/reboot-core"
          test "$MODE" = "topology-smoke"

  agent:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare the allowlisted output directory
        run: install -d -m 0700 "$RUNNER_TEMP/m3-agent-output"

      - name: Pull the pinned smoke image
        run: docker pull "$M3_SMOKE_IMAGE"

      - name: Run deterministic agent stub in a restricted no-network container
        env:
          OUTPUT_DIR: ${{ runner.temp }}/m3-agent-output
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --memory=2g \
            --cpus=1 \
            --pids-limit=64 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --tmpfs "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=$(id -u),gid=$(id -g)" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/experiments/e007/evaluator/agent_stub.py,dst=/agent_stub.py,readonly" \
            --mount "type=bind,src=$OUTPUT_DIR,dst=/out" \
            "$M3_SMOKE_IMAGE" python /agent_stub.py --output /out

      - name: Upload only candidate and trace
        uses: actions/upload-artifact@v4
        with:
          name: m3-agent-output
          path: |
            ${{ runner.temp }}/m3-agent-output/candidate.json
            ${{ runner.temp }}/m3-agent-output/trace.jsonl
          if-no-files-found: error
          retention-days: 1

  evaluator:
    needs: agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: m3-evaluator
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download only the agent artifact
        uses: actions/download-artifact@v4
        with:
          name: m3-agent-output
          path: ${{ runner.temp }}/m3-evaluator-input

      - name: Prepare evaluator output directory
        run: install -d -m 0700 "$RUNNER_TEMP/m3-evaluator-output"

      - name: Pull the pinned smoke image
        run: docker pull "$M3_SMOKE_IMAGE"

      - name: Reject unexpected artifact entries
        env:
          INPUT_DIR: ${{ runner.temp }}/m3-evaluator-input
        run: |
          set -euo pipefail
          test -f "$INPUT_DIR/candidate.json"
          test -f "$INPUT_DIR/trace.jsonl"
          test "$(find "$INPUT_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          test -z "$(find "$INPUT_DIR" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test -z "$(find "$INPUT_DIR" -type l -print -quit)"
          test -z "$(find "$INPUT_DIR" -type f -links +1 -print -quit)"

      - name: Evaluate candidate as data in a separate no-network container
        env:
          INPUT_DIR: ${{ runner.temp }}/m3-evaluator-input
          OUTPUT_DIR: ${{ runner.temp }}/m3-evaluator-output
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --memory=2g \
            --cpus=1 \
            --pids-limit=64 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --tmpfs "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=$(id -u),gid=$(id -g)" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/experiments/e007/evaluator,dst=/evaluator,readonly" \
            --mount "type=bind,src=$INPUT_DIR,dst=/input,readonly" \
            --mount "type=bind,src=$OUTPUT_DIR,dst=/out" \
            "$M3_SMOKE_IMAGE" python /evaluator/evaluator_job.py \
              --workspace /input \
              --candidate /input/candidate.json \
              --output /out/score.json

      - name: Upload only the score summary
        uses: actions/upload-artifact@v4
        with:
          name: m3-evaluator-score
          path: ${{ runner.temp }}/m3-evaluator-output/score.json
          if-no-files-found: error
          retention-days: 1
