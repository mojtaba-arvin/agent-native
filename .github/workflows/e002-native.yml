name: E-002 native, WASI, and BEAM baseline checks

on:
  workflow_dispatch:
    inputs:
      run_benchmark_matrix:
        description: Run the ten-repetition cross-runtime diagnostic matrix (not a runtime decision)
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "experiments/e002/**"
      - ".github/workflows/e002-native.yml"
  push:
    branches:
      - main
      - "research/**"
    paths:
      - "experiments/e002/**"
      - ".github/workflows/e002-native.yml"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile experiments/e002/conformance.py experiments/e002/benchmark.py experiments/e002/run_matrix.py experiments/e002/measure_artifacts.py
      - run: python -m unittest discover -s experiments/e002 -p 'test_*.py' -v
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
      - run: go test ./...
        working-directory: experiments/e002/go
      - run: go build -o /tmp/e002-go .
        working-directory: experiments/e002/go
      - run: python experiments/e002/conformance.py --command /tmp/e002-go --cwd experiments/e002/go
      - name: Smoke-test sampled process-tree CPU accounting
        run: |
          python experiments/e002/benchmark.py \
            --command /tmp/e002-go \
            --cwd experiments/e002/go \
            --requests 100 --concurrency 8 --warmup 10 \
            --label cpu-sampler-smoke --output /tmp/e002-cpu-sampler-smoke
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("/tmp/e002-cpu-sampler-smoke.json").read_text())
          assert summary["functional_success"] is True
          assert summary["cpu_accounting"]["method"] == "sampled_process_tree_cumulative_max"
          assert summary["cpu_accounting"]["sample_interval_seconds"] == 0.005
          assert summary["cpu_seconds"] >= 0
          assert summary["peak_rss_bytes"] > 0
          print("E-002 sampled CPU accounting smoke: PASS")
          PY

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile experiments/e002/conformance.py experiments/e002/benchmark.py experiments/e002/run_matrix.py
      - uses: dtolnay/rust-toolchain@1.100.0
      - run: cargo test --locked
        working-directory: experiments/e002/rust
      - run: cargo build --locked --release
        working-directory: experiments/e002/rust
      - run: python experiments/e002/conformance.py --command ./target/release/agent-native-e002-rust --cwd experiments/e002/rust

  wasi-p2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-wasip2
      - name: Build WASI 0.2 component
        run: cargo build --locked --release --target wasm32-wasip2
        working-directory: experiments/e002/wasi-p2
      - name: Install pinned Wasmtime
        run: |
          curl -fsSL https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.1/wasmtime-v50.0.1-x86_64-linux.tar.xz -o /tmp/wasmtime.tar.xz
          tar -xJf /tmp/wasmtime.tar.xz -C /tmp
          WASMTIME_BIN="$(find /tmp -type f -name wasmtime -perm -111 2>/dev/null | head -n 1)"
          test -n "$WASMTIME_BIN"
          echo "$(dirname "$WASMTIME_BIN")" >> "$GITHUB_PATH"
      - name: Run shared HTTP conformance checks
        run: python experiments/e002/conformance.py --command "wasmtime serve --addr=127.0.0.1:8080 -S cli=y -S http=y target/wasm32-wasip2/release/agent_native_e002_wasi_p2.wasm" --cwd experiments/e002/wasi-p2

  beam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.5"
      - run: mix test
        working-directory: experiments/e002/beam
      - run: python -m py_compile experiments/e002/conformance.py experiments/e002/benchmark.py experiments/e002/run_matrix.py
      - run: python experiments/e002/conformance.py --command "mix run -e AgentNativeE002Beam.Server.main()" --cwd experiments/e002/beam
      - name: Smoke-test descendant CPU accounting with BEAM
        run: |
          python experiments/e002/benchmark.py \
            --command "mix run -e AgentNativeE002Beam.Server.main()" \
            --cwd experiments/e002/beam \
            --requests 100 --concurrency 8 --warmup 10 \
            --label beam-cpu-sampler-smoke --output /tmp/e002-beam-cpu-sampler-smoke
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("/tmp/e002-beam-cpu-sampler-smoke.json").read_text())
          assert summary["functional_success"] is True
          assert summary["cpu_accounting"]["method"] == "sampled_process_tree_cumulative_max"
          assert summary["cpu_accounting"]["observed_process_count"] >= 1
          assert summary["cpu_seconds"] >= 0
          assert summary["peak_rss_bytes"] > 0
          print("E-002 BEAM descendant CPU accounting smoke: PASS")
          PY

  benchmark-matrix:
    if: (github.event_name == 'workflow_dispatch' && inputs.run_benchmark_matrix) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[benchmark]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-wasip2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.5"
      - name: Build Go candidate
        run: go build -o /tmp/e002-go .
        working-directory: experiments/e002/go
      - name: Build Rust candidate
        run: cargo build --locked --release
        working-directory: experiments/e002/rust
      - name: Build WASI component
        run: cargo build --locked --release --target wasm32-wasip2
        working-directory: experiments/e002/wasi-p2
      - name: Test BEAM candidate
        run: mix test
        working-directory: experiments/e002/beam
      - name: Build self-contained BEAM release
        run: MIX_ENV=prod mix release --overwrite
        working-directory: experiments/e002/beam
      - name: Install pinned Wasmtime
        run: |
          curl -fsSL https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.1/wasmtime-v50.0.1-x86_64-linux.tar.xz -o /tmp/wasmtime.tar.xz
          tar -xJf /tmp/wasmtime.tar.xz -C /tmp
          WASMTIME_BIN="$(find /tmp -type f -name wasmtime -perm -111 2>/dev/null | head -n 1)"
          test -n "$WASMTIME_BIN"
          echo "$(dirname "$WASMTIME_BIN")" >> "$GITHUB_PATH"
      - name: Measure deployable payload sizes (diagnostic only)
        run: |
          mkdir -p /tmp/e002-results
          python experiments/e002/measure_artifacts.py \
            --go /tmp/e002-go \
            --rust experiments/e002/rust/target/release/agent-native-e002-rust \
            --wasi-component experiments/e002/wasi-p2/target/wasm32-wasip2/release/agent_native_e002_wasi_p2.wasm \
            --wasmtime "$(command -v wasmtime)" \
            --beam-release experiments/e002/beam/_build/prod/rel/agent_native_e002_beam \
            --output /tmp/e002-results/artifact-sizes.json
      - name: Run randomized ten-repetition matrix (diagnostic only)
        run: |
          python experiments/e002/run_matrix.py \
            --go-command /tmp/e002-go \
            --rust-command ./target/release/agent-native-e002-rust \
            --wasi-command "wasmtime serve --addr=127.0.0.1:8080 -S cli=y -S http=y target/wasm32-wasip2/release/agent_native_e002_wasi_p2.wasm" \
            --beam-command "mix run -e AgentNativeE002Beam.Server.main()" \
            --requests 5000 --concurrency 32 --warmup 250 --repetitions 10 \
            --output /tmp/e002-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e002-ten-repetition-diagnostic-matrix
          path: /tmp/e002-results/
          if-no-files-found: error
          retention-days: 14
