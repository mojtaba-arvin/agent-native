name: M3-007 Alternative CPU Model Cohort

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Bootstrap records digests; verify checks a fresh pull offline; trial runs the six-cell E-009 matrix
        required: true
        type: choice
        options: [bootstrap, verify, trial]
        default: bootstrap
      verification_run_id:
        description: Required for trial; successful run ID of the separate offline verification
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: m3-007-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  cohort:
    if: github.ref == 'refs/heads/research/m3-007-alternative-cohort' || github.ref == 'refs/heads/research/reboot-core'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OLLAMA_IMAGE: ollama/ollama@sha256:a717bfc1c56acfc2e85d3109bd40a7646258ec9062c40cea83b9ed0927eb4223
      PYTHON_IMAGE: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
      CANDIDATES: experiments/e007/model_candidates_v2.json
      LOCK: experiments/e007/model-lock-v2.json
      MODEL_DIR: ${{ runner.temp }}/m3-007-models
      DETAILS_DIR: ${{ runner.temp }}/m3-007-details
      OUTPUT_DIR: ${{ runner.temp }}/m3-007-output
    steps:
      - name: Require the locked manifest for verify and trial
        if: inputs.phase != 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$LOCK"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_EVENT_PATH" != "" ]]; then :; fi
          python3 - "$CANDIDATES" "$LOCK" <<'PY'
          import json,sys
          c=json.load(open(sys.argv[1],encoding="utf-8"))
          lock=json.load(open(sys.argv[2],encoding="utf-8"))
          if c.get("status") != "manifest_locked_not_qualified":
              raise SystemExit("candidate_manifest_not_locked")
          if lock.get("status") != "locked_not_qualified":
              raise SystemExit("model_lock_not_sealed")
          PY

      - name: Require a prior separate verification run for trial
        if: inputs.phase == 'trial'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m3-007-verification-${{ inputs.verification_run_id }}
          run-id: ${{ inputs.verification_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-verification

      - name: Check prior verification is for this exact lock
        if: inputs.phase == 'trial'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$LOCK" "$RUNNER_TEMP/prior-verification/verification-report.json" <<'PY'
          import hashlib,json,sys
          lock_sha=hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest()
          report=json.load(open(sys.argv[2],encoding="utf-8"))
          if report.get("status") != "verified" or report.get("inference_executed") is not False:
              raise SystemExit("prior_verification_not_valid")
          if report.get("model_lock_sha256") != lock_sha:
              raise SystemExit("prior_verification_lock_sha_mismatch")
          PY

      - name: Prepare private model store and evidence directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR" "$DETAILS_DIR" "$OUTPUT_DIR" "$RUNNER_TEMP/ollama-home"
          chmod 700 "$MODEL_DIR" "$DETAILS_DIR" "$OUTPUT_DIR"
          printf 'RUNNER_UID=%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'RUNNER_GID=%s\n' "$(id -g)" >> "$GITHUB_ENV"
          python3 - "$OUTPUT_DIR/runner-info.json" "$MODEL_DIR" <<'PY'
          import json,os,platform,shutil,sys
          from pathlib import Path
          mem=next((int(x.split()[1])*1024 for x in Path("/proc/meminfo").read_text().splitlines() if x.startswith("MemTotal:")),None)
          d=shutil.disk_usage(sys.argv[2])
          Path(sys.argv[1]).write_text(json.dumps({"os":platform.platform(),"architecture":platform.machine(),"logical_cpu_count":os.cpu_count(),"memory_total_bytes":mem,"model_disk_total_bytes":d.total,"model_disk_free_bytes":d.free},indent=2,sort_keys=True)+"\n")
          PY

      - name: Pull pinned runtime images
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$OLLAMA_IMAGE"
          docker pull --platform linux/amd64 "$PYTHON_IMAGE"

      - name: Start temporary registry-connected model puller
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ollama-pull --platform linux/amd64 --network bridge \
            -p 127.0.0.1:11434:11434 --user "$RUNNER_UID:$RUNNER_GID" \
            --memory=4g --cpus=2 --pids-limit=128 --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs "/tmp:rw,noexec,nosuid,nodev,size=1g,uid=$RUNNER_UID,gid=$RUNNER_GID" \
            --mount "type=bind,src=$MODEL_DIR,dst=/models" \
            --mount "type=bind,src=$RUNNER_TEMP/ollama-home,dst=/home/ollama" \
            -e HOME=/home/ollama -e OLLAMA_MODELS=/models -e OLLAMA_HOST=0.0.0.0:11434 \
            "$OLLAMA_IMAGE" serve
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "ollama_pull_service_not_ready" >&2
          exit 1

      - name: Download the three preregistered public models
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r model; do
            test -n "$model"
            docker exec -e OLLAMA_HOST=127.0.0.1:11434 ollama-pull ollama pull "$model"
          done < <(python3 -c 'import json;print("\n".join(x["tag"] for x in json.load(open("'"$CANDIDATES"'"))["models"]))')
          python3 - "$CANDIDATES" "$DETAILS_DIR" <<'PY'
          import hashlib,json,sys,urllib.request
          from pathlib import Path
          candidates=json.load(open(sys.argv[1],encoding="utf-8"))
          out=Path(sys.argv[2])
          for model in candidates["models"]:
              body=json.dumps({"name":model["tag"]}).encode()
              req=urllib.request.Request("http://127.0.0.1:11434/api/show",data=body,headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=90) as response: details=json.loads(response.read())
              (out/(hashlib.sha256(model["tag"].encode()).hexdigest()+".json")).write_text(json.dumps(details,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Stop all registry-connected services
        run: |
          docker stop ollama-pull
          docker rm ollama-pull

      - name: Collect bootstrap evidence (no inference)
        if: inputs.phase == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --user "$RUNNER_UID:$RUNNER_GID" \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$MODEL_DIR,dst=/models,readonly" \
            --mount "type=bind,src=$DETAILS_DIR,dst=/details,readonly" \
            --mount "type=bind,src=$OUTPUT_DIR,dst=/out" \
            "$PYTHON_IMAGE" python /repo/experiments/e007/m3_alt_model_cohort.py collect \
            --candidates "/repo/$CANDIDATES" --model-dir /models --details-dir /details \
            --output /out/bootstrap-observation.json --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --ollama-version "$(cat "$OUTPUT_DIR/ollama-version.txt")"

      - name: Verify a fresh model pull in a separate offline run
        if: inputs.phase == 'verify' || inputs.phase == 'trial'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --user "$RUNNER_UID:$RUNNER_GID" \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$MODEL_DIR,dst=/models,readonly" \
            --mount "type=bind,src=$DETAILS_DIR,dst=/details,readonly" \
            --mount "type=bind,src=$OUTPUT_DIR,dst=/out" \
            "$PYTHON_IMAGE" python /repo/experiments/e007/m3_alt_model_cohort.py verify \
            --candidates "/repo/$CANDIDATES" --lock "/repo/$LOCK" \
            --model-dir /models --details-dir /details --output /out/verification-report.json \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --ollama-version "$(cat "$OUTPUT_DIR/ollama-version.txt")"

      - name: Upload bootstrap observation
        if: always() && inputs.phase == 'bootstrap'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-007-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-007-output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload offline verification evidence
        if: always() && inputs.phase == 'verify'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-007-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-007-output/verification-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Run the real E-009 six-cell agent matrix
        if: inputs.phase == 'trial'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ollama-smoke --platform linux/amd64 --network none \
            --user "$RUNNER_UID:$RUNNER_GID" --memory=10g --cpus=3 --pids-limit=128 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs "/tmp:rw,noexec,nosuid,nodev,size=512m,uid=$RUNNER_UID,gid=$RUNNER_GID" \
            --tmpfs "/home/ollama:rw,noexec,nosuid,nodev,size=64m,uid=$RUNNER_UID,gid=$RUNNER_GID" \
            --mount "type=bind,src=$MODEL_DIR,dst=/models,readonly" \
            -e HOME=/home/ollama -e OLLAMA_MODELS=/models -e OLLAMA_HOST=127.0.0.1:11434 \
            -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 "$OLLAMA_IMAGE" serve
          for i in $(seq 1 60); do
            if docker exec ollama-smoke ollama list >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec ollama-smoke ollama list
          docker inspect ollama-smoke | python3 -c '
          import json,sys
          c=json.load(sys.stdin)[0];h=c["HostConfig"];m={x["Destination"]:x for x in c.get("Mounts",[])}
          o={"user":c["Config"].get("User"),"network_mode":h.get("NetworkMode"),"memory_bytes":h.get("Memory"),"nano_cpus":h.get("NanoCpus"),"pids_limit":h.get("PidsLimit"),"readonly_rootfs":h.get("ReadonlyRootfs"),"cap_drop":h.get("CapDrop") or [],"security_opt":h.get("SecurityOpt") or [],"tmp_noexec":"noexec" in h.get("Tmpfs",{}).get("/tmp",""),"model_mount_read_only":bool(m.get("/models") and not m["/models"].get("RW",True))}
          open("'"$OUTPUT_DIR"'/ollama-server-sandbox.json","w").write(json.dumps(o,indent=2,sort_keys=True)+"\n")'
          docker exec ollama-smoke ollama --version > "$OUTPUT_DIR/ollama-version.txt"
          docker run --rm --name m3-model-agent --platform linux/amd64 \
            --network container:ollama-smoke --user "$RUNNER_UID:$RUNNER_GID" \
            --memory=2g --cpus=1 --pids-limit=64 --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs "/tmp:rw,noexec,nosuid,nodev,size=512m,uid=$RUNNER_UID,gid=$RUNNER_GID" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$OUTPUT_DIR,dst=/out" \
            -e PYTHONPATH=/repo/experiments/e009:/repo/experiments/e007/evaluator \
            -e PYTHONDONTWRITEBYTECODE=1 -e HOME=/tmp \
            -e MODEL_CANDIDATES=/repo/$CANDIDATES -e MODEL_MANIFESTS=/out/verification-report.json \
            -e MODEL_LOCK=/repo/$LOCK -e RUNNER_INFO=/out/runner-info.json \
            -e OLLAMA_SERVER_CONFIG=/out/ollama-server-sandbox.json \
            -e OLLAMA_URL=http://127.0.0.1:11434 \
            -e OLLAMA_VERSION="$(cat "$OUTPUT_DIR/ollama-version.txt")" \
            -e OLLAMA_IMAGE="$OLLAMA_IMAGE" -e PYTHON_IMAGE="$PYTHON_IMAGE" \
            "$PYTHON_IMAGE" python /repo/experiments/e007/m3_model_smoke.py
          docker logs ollama-smoke > "$OUTPUT_DIR/ollama-server.log" 2>&1 || true
          docker stop ollama-smoke
          docker rm ollama-smoke

      - name: Upload six-cell raw model evidence
        if: always() && inputs.phase == 'trial'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-007-trial-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-007-output/
          if-no-files-found: warn
          retention-days: 90

      - name: Stop remaining containers
        if: always()
        run: |
          docker stop ollama-pull ollama-smoke >/dev/null 2>&1 || true
          docker rm ollama-pull ollama-smoke >/dev/null 2>&1 || true
