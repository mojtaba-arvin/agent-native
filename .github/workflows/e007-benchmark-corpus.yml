name: E-007 benchmark corpus checks

on:
  pull_request:
    paths:
      - "experiments/e007/**"
      - ".github/workflows/e007-benchmark-corpus.yml"
  push:
    branches:
      - main
      - "research/**"
    paths:
      - "experiments/e007/**"
      - ".github/workflows/e007-benchmark-corpus.yml"

permissions:
  contents: read

jobs:
  corpus-and-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - run: python -m unittest discover -s experiments/e007 -v
