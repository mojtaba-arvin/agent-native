name: E-005 agent interface checks

on:
  pull_request:
    paths:
      - "experiments/e005/**"
      - ".github/workflows/e005-agent-interface.yml"
  push:
    branches:
      - main
      - "research/**"
    paths:
      - "experiments/e005/**"
      - ".github/workflows/e005-agent-interface.yml"

permissions:
  contents: read

jobs:
  protocol-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - run: python -m unittest discover -s experiments/e005 -v
