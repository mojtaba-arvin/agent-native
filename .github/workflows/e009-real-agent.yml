name: E-009 real-model agent trial

on:
  workflow_dispatch:
  push:
    branches:
      - research/reboot-core
    paths:
      - experiments/e009/dispatch.json

permissions:
  contents: read

concurrency:
  group: e009-real-model-agent-trial
  cancel-in-progress: false

jobs:
  real-model-trial:
    name: Run one bounded Qwen3 agent trial
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the pinned branch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install Ollama
        run: |
          curl --fail --silent --show-error --location https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama with the Qwen3-compatible template renderer
        shell: bash
        run: |
          set -euo pipefail
          ollama --version | tee /tmp/ollama-version.txt
          # The installer may have already started the system service. Stop it so
          # the renderer setting below is applied to the only Ollama daemon.
          sudo systemctl stop ollama.service 2>/dev/null || true
          OLLAMA_GO_TEMPLATE=false OLLAMA_HOST=127.0.0.1:11434 ollama serve > /tmp/ollama-serve.log 2>&1 &
          for attempt in $(seq 1 60); do
            if ollama list >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          ollama list
          ollama pull qwen3:8b
          ollama show qwen3:8b --modelfile > /tmp/qwen3-modelfile.txt
          ollama list > /tmp/ollama-models.txt

      - name: Run the real model through the E-009 Agent Gateway
        id: agent
        continue-on-error: true
        run: |
          set -o pipefail
          python experiments/e009/local_agent.py \
            --model qwen3:8b \
            --arm upfront \
            --results-dir /tmp/agent-native-e009-runs \
            --max-input-tokens 24000 \
            --max-output-tokens 6000 \
            --max-tool-calls 20 \
            --max-wall-seconds 900 \
            --num-ctx 8192 \
            --num-predict 2048 \
            --temperature 0 \
            --top-p 1 \
            --seed 42 | tee /tmp/e009-agent-console.json

      - name: Summarize trial outcome
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          root = pathlib.Path("/tmp/agent-native-e009-runs")
          records = sorted(root.glob("*/run.json")) if root.exists() else []
          summary = {
              "workflow_sha": "${{ github.sha }}",
              "model": "qwen3:8b",
              "trial_count": len(records),
              "runs": [],
          }
          for path in records:
              record = json.loads(path.read_text())
              summary["runs"].append({
                  key: record.get(key)
                  for key in (
                      "run_id", "status", "failure", "duration_ms",
                      "input_tokens", "output_tokens", "tool_calls",
                      "verification",
                  )
              })
          output = pathlib.Path("/tmp/e009-trial-summary.json")
          output.write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("## E-009 real-model trial\n\n")
              stream.write("- Model: `qwen3:8b` (Ollama)\n")
              stream.write(f"- Trial records: {len(records)}\n")
              for run in summary["runs"]:
                  stream.write(f"- `{run['run_id']}`: **{run['status']}**")
                  if run.get("failure"):
                      stream.write(f" — `{run['failure']}`")
                  stream.write("\n")
              stream.write("\nA locally verified candidate is not an independently accepted candidate.\n")
          PY

      - name: Upload immutable trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e009-real-model-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/agent-native-e009-runs/
            /tmp/e009-trial-summary.json
            /tmp/e009-agent-console.json
            /tmp/ollama-version.txt
            /tmp/ollama-models.txt
            /tmp/qwen3-modelfile.txt
            /tmp/ollama-serve.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the workflow when the agent trial fails
        if: steps.agent.outcome == 'failure'
        run: exit 1
