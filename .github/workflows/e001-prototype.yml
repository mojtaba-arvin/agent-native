name: E-001 representation and baseline checks

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - "experiments/e001/**"
      - ".github/workflows/e001-prototype.yml"
  push:
    branches:
      - main
      - "research/**"
    paths:
      - "experiments/e001/**"
      - ".github/workflows/e001-prototype.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - name: Run parser tests
        run: python -m unittest discover -s experiments/e001/prototype -v
      - name: Compile example to canonical JSON
        run: python experiments/e001/prototype/agent_native.py experiments/e001/examples/catalog.an > /tmp/catalog-ir.json
      - name: Validate deterministic output
        run: |
          python experiments/e001/prototype/agent_native.py experiments/e001/examples/catalog.an > /tmp/catalog-ir-second.json
          cmp /tmp/catalog-ir.json /tmp/catalog-ir-second.json

  go-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
      - run: go test ./...
        working-directory: experiments/e001/baselines/go

  rust-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - run: cargo test --locked
        working-directory: experiments/e001/baselines/rust
