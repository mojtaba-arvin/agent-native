name: E-007 deterministic post-fix expanded-budget Qwen3 trial

on:
  workflow_dispatch:
  push:
    branches:
      - "research/**"
    paths:
      - "experiments/e007/dispatch.json"

permissions:
  contents: read

concurrency:
  group: e007-real-agent-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qwen3-deterministic-postfix-expanded-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ollama
        run: |
          curl --fail --silent --show-error --location https://ollama.com/install.sh | sh
          ollama --version | tee /tmp/ollama-version.txt
      - name: Start Ollama with the Qwen3-compatible template renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop ollama.service 2>/dev/null || true
          OLLAMA_GO_TEMPLATE=false OLLAMA_HOST=127.0.0.1:11434 ollama serve > /tmp/ollama-serve.log 2>&1 &
          for attempt in $(seq 1 60); do
            if ollama list >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          ollama list
          ollama pull qwen3:8b
          ollama show qwen3:8b --modelfile > /tmp/qwen3-modelfile.txt
          ollama list > /tmp/ollama-models.txt
      - name: Run one deterministic expanded-budget real-agent eval
        run: |
          python experiments/e007/eval_runner.py \
            --case experiments/e007/evals/e009-readonly-proposal-postfix-expanded-budget.eval.json \
            --model qwen3:8b \
            --arm upfront \
            --repetitions 1 \
            --max-input-tokens 120000 \
            --max-output-tokens 6000 \
            --max-tool-calls 20 \
            --max-wall-seconds 3000 \
            --num-ctx 16384 \
            --num-predict 2048 \
            --temperature 0 \
            --seed 42 \
            --output-dir /tmp/agent-native-e007-evals
      - name: Upload eval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e007-qwen3-deterministic-postfix-expanded-budget
          path: |
            /tmp/agent-native-e007-evals/
            /tmp/ollama-version.txt
            /tmp/ollama-models.txt
            /tmp/qwen3-modelfile.txt
            /tmp/ollama-serve.log
          if-no-files-found: warn
          retention-days: 14
