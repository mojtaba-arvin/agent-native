name: E-007 real-agent evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - "research/**"
    paths:
      - "experiments/e007/dispatch.json"

permissions:
  contents: read

concurrency:
  group: e007-real-agent-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qwen3-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1
      - name: Pull pinned local model
        run: ollama pull qwen3:8b
      - name: Run three real-agent eval repetitions
        run: |
          python experiments/e007/eval_runner.py \
            --case experiments/e007/evals/e009-readonly-proposal.eval.json \
            --model qwen3:8b \
            --arm upfront \
            --repetitions 3 \
            --max-input-tokens 48000 \
            --max-output-tokens 6000 \
            --max-tool-calls 20 \
            --max-wall-seconds 900 \
            --num-ctx 8192 \
            --num-predict 2048 \
            --output-dir /tmp/agent-native-e007-evals
      - name: Upload eval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e007-qwen3-real-agent-eval
          path: /tmp/agent-native-e007-evals/
          if-no-files-found: warn
          retention-days: 14
