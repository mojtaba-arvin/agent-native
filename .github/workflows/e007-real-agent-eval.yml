name: E-007 matched proposal-surface factorial pilot

on:
  workflow_dispatch:
  # PR synchronize is a one-shot dispatch proxy. Ordinary commits are checked
  # against the marker and skip every model/provisioning step.
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: e007-factorial-pilot-\${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  matched-qwen3-factorial:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'research/reboot-core') ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'synchronize' &&
       github.event.pull_request.head.ref == 'research/reboot-core' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Authorize explicit factorial request
        id: authorize
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('valid', 'true');
              core.setOutput('pinned_sha', context.sha);
              core.setOutput('ref_name', context.ref.replace(/^refs\\/heads\\//, ''));
              return;
            }
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
            const subject = commit.commit.message.split('\\n', 1)[0];
            const { data: file } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'experiments/e007/dispatch-request.json',
              ref: sha
            });
            if (Array.isArray(file) || file.type !== 'file' || !file.content) {
              core.setOutput('valid', 'false');
              return;
            }
            const marker = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            const expected = {
              schema_version: 1,
              request_id: 'e007-matched-factorial-qwen3-20261118-retry1',
              branch: 'research/reboot-core',
              workflow: 'e007-real-agent-eval.yml',
              model: 'qwen3:8b',
              repetitions: 1,
              factorial_cells: ['A', 'B', 'C', 'D'],
              no_apply: true,
              budgets_unchanged: true
            };
            const valid = subject === 'experiment(e007): dispatch one bounded factorial cohort'
              && JSON.stringify(marker) === JSON.stringify(expected);
            core.setOutput('valid', valid ? 'true' : 'false');
            core.setOutput('pinned_sha', sha);
            core.setOutput('ref_name', context.payload.pull_request.head.ref);
            if (!valid) core.notice('No matching one-shot E-007 marker; all model steps will be skipped.');
      - name: Checkout pinned request revision
        if: steps.authorize.outputs.valid == 'true'
        uses: actions/checkout@v4
        with:
          ref: \${{ steps.authorize.outputs.pinned_sha }}
      - name: Set up Python
        if: steps.authorize.outputs.valid == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate factorial dispatch before provisioning the model
        if: steps.authorize.outputs.valid == 'true'
        run: |
          python experiments/e007/validate_factorial_dispatch.py
          bash -n experiments/e007/run_factorial_pilot.sh
          python -m unittest discover -s experiments/e007 -v
          python -m unittest discover -s experiments/e009 -v
      - name: Install Ollama
        if: steps.authorize.outputs.valid == 'true'
        run: |
          curl --fail --silent --show-error --location https://ollama.com/install.sh | sh
          ollama --version | tee /tmp/ollama-version.txt
      - name: Start Ollama and pull the pinned model
        if: steps.authorize.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop ollama.service 2>/dev/null || true
          OLLAMA_GO_TEMPLATE=false OLLAMA_HOST=127.0.0.1:11434 ollama serve > /tmp/ollama-serve.log 2>&1 &
          for attempt in $(seq 1 60); do
            if ollama list >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ollama list
          ollama pull qwen3:8b
          ollama show qwen3:8b --modelfile > /tmp/qwen3-modelfile.txt
          ollama list > /tmp/ollama-models.txt
      - name: Run matched A-D pilot
        if: steps.authorize.outputs.valid == 'true'
        env:
          FACTORIAL_OUTPUT_DIR: /tmp/agent-native-e007-factorial-\${{ github.run_id }}-\${{ github.run_attempt }}
          E007_PINNED_REV: \${{ steps.authorize.outputs.pinned_sha }}
          E007_REF_NAME: \${{ steps.authorize.outputs.ref_name }}
        run: bash experiments/e007/run_factorial_pilot.sh
      - name: Upload factorial evidence
        if: always() && steps.authorize.outputs.valid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e007-matched-proposal-surface-factorial
          path: |
            /tmp/agent-native-e007-factorial-\${{ github.run_id }}-\${{ github.run_attempt }}/
            /tmp/ollama-version.txt
            /tmp/ollama-models.txt
            /tmp/qwen3-modelfile.txt
            /tmp/ollama-serve.log
          if-no-files-found: warn
          retention-days: 30
      - name: Publish E-007 run and artifact reference to issue #61
        if: always() && steps.authorize.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId
            });
            const { data: listed } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId
            });
            const artifact = listed.artifacts.find(item =>
              item.name === 'e007-matched-proposal-surface-factorial'
            );
            const artifactLine = artifact
              ? '[factorial artifact ' + artifact.id + '](https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId + '/artifacts/' + artifact.id + ')'
              : 'No factorial artifact was uploaded.';
            const body = [
              '## E-007 one-shot factorial run result',
              '',
              'Run: ' + run.html_url,
              'Run ID: ' + run.id,
              'Conclusion: ' + (run.conclusion || run.status),
              'Pinned commit: \`' + context.sha + '\`',
              'Request ID: \`e007-matched-factorial-qwen3-20261118-retry1\`',
              '',
              artifactLine,
              '',
              'A completed workflow is not acceptance by itself. Verify all four cells and the same proposal hash across propose → validate → plan, with no apply.'
            ].join('\\n');
            await github.rest.issues.createComment({
              owner, repo, issue_number: 61, body
            });
