name: E-007 matched proposal-surface factorial pilot

on:
  workflow_dispatch:
  # Explicit one-shot dispatch proxy: only a dedicated marker commit on the
  # research branch can start the expensive cohort; ordinary pushes cannot.
  push:
    branches:
      - research/reboot-core
    paths:
      - "experiments/e007/dispatch-request.json"

permissions:
  contents: read

concurrency:
  group: e007-factorial-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matched-qwen3-factorial:
    if: >-
      github.ref_name == 'research/reboot-core' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'experiment(e007): dispatch one bounded factorial cohort')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate explicit one-shot dispatch marker
        if: github.event_name == 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected = {
              "schema_version": 1,
              "request_id": "e007-matched-factorial-qwen3-20261118-one-shot",
              "branch": "research/reboot-core",
              "workflow": "e007-real-agent-eval.yml",
              "model": "qwen3:8b",
              "repetitions": 1,
              "factorial_cells": ["A", "B", "C", "D"],
              "no_apply": True,
              "budgets_unchanged": True,
          }
          actual = json.loads(Path("experiments/e007/dispatch-request.json").read_text())
          assert actual == expected, "dispatch marker mismatch"
          assert os.environ["EVENT_NAME"] == "push"
          assert os.environ["REF_NAME"] == expected["branch"]
          assert os.environ["COMMIT_MESSAGE"] == "experiment(e007): dispatch one bounded factorial cohort"
          print("Explicit one-shot E-007 dispatch marker validated; original budgets remain pinned.")
          PY
      - name: Validate factorial dispatch before provisioning the model
        run: |
          python experiments/e007/validate_factorial_dispatch.py
          bash -n experiments/e007/run_factorial_pilot.sh
          python -m unittest discover -s experiments/e007 -v
          python -m unittest discover -s experiments/e009 -v
      - name: Install Ollama
        run: |
          curl --fail --silent --show-error --location https://ollama.com/install.sh | sh
          ollama --version | tee /tmp/ollama-version.txt
      - name: Start Ollama and pull the pinned model
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop ollama.service 2>/dev/null || true
          OLLAMA_GO_TEMPLATE=false OLLAMA_HOST=127.0.0.1:11434 ollama serve > /tmp/ollama-serve.log 2>&1 &
          for attempt in $(seq 1 60); do
            if ollama list >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ollama list
          ollama pull qwen3:8b
          ollama show qwen3:8b --modelfile > /tmp/qwen3-modelfile.txt
          ollama list > /tmp/ollama-models.txt
      - name: Run matched A-D pilot
        env:
          FACTORIAL_OUTPUT_DIR: /tmp/agent-native-e007-factorial-${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash experiments/e007/run_factorial_pilot.sh
      - name: Upload factorial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e007-matched-proposal-surface-factorial
          path: |
            /tmp/agent-native-e007-factorial-${{ github.run_id }}-${{ github.run_attempt }}/
            /tmp/ollama-version.txt
            /tmp/ollama-models.txt
            /tmp/qwen3-modelfile.txt
            /tmp/ollama-serve.log
          if-no-files-found: warn
          retention-days: 30
