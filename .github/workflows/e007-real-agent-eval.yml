name: E-007 matched proposal-surface factorial pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e007-factorial-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matched-qwen3-factorial:
    if: github.ref_name == 'research/reboot-core'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate factorial dispatch before provisioning the model
        run: |
          python experiments/e007/validate_factorial_dispatch.py
          bash -n experiments/e007/run_factorial_pilot.sh
      - name: Install Ollama
        run: |
          curl --fail --silent --show-error --location https://ollama.com/install.sh | sh
          ollama --version | tee /tmp/ollama-version.txt
      - name: Start Ollama and pull the pinned model
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop ollama.service 2>/dev/null || true
          OLLAMA_GO_TEMPLATE=false OLLAMA_HOST=127.0.0.1:11434 ollama serve > /tmp/ollama-serve.log 2>&1 &
          for attempt in $(seq 1 60); do
            if ollama list >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ollama list
          ollama pull qwen3:8b
          ollama show qwen3:8b --modelfile > /tmp/qwen3-modelfile.txt
          ollama list > /tmp/ollama-models.txt
      - name: Run matched A-D pilot
        env:
          FACTORIAL_OUTPUT_DIR: /tmp/agent-native-e007-factorial-${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash experiments/e007/run_factorial_pilot.sh
      - name: Upload factorial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e007-matched-proposal-surface-factorial
          path: |
            /tmp/agent-native-e007-factorial-${{ github.run_id }}-${{ github.run_attempt }}/
            /tmp/ollama-version.txt
            /tmp/ollama-models.txt
            /tmp/qwen3-modelfile.txt
            /tmp/ollama-serve.log
          if-no-files-found: warn
          retention-days: 30
