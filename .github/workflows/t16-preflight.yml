name: T16 preflight contract

on:
  push:
    branches:
      - "task/T16-slo-run-controlled-host"
    paths:
      - "experiments/e002/t16/**"
      - ".github/workflows/t16-preflight.yml"
  pull_request:
    paths:
      - "experiments/e002/t16/**"
      - ".github/workflows/t16-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-contract:
    name: T16 preregistration, workload, and PostgreSQL contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      T16_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/agent_native
      T16_PSQL_DSN: postgresql://postgres:postgres@127.0.0.1:5432/agent_native
      T16_READ_TOKEN: test-read-token
      T16_DENY_TOKEN: test-deny-token
      T16_TENANT_ID: tenant-a
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_native
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_native"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - name: Compile preflight tooling
        run: python -m py_compile experiments/e002/t16/preflight.py experiments/e002/t16/run.py
      - name: Install PostgreSQL test driver
        run: python -m pip install "psycopg[binary]==3.2.9"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install T16 PostgreSQL schema
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg

          schema = Path("experiments/e002/t16/schema.sql").read_text(encoding="utf-8")
          with psycopg.connect(os.environ["T16_POSTGRES_DSN"]) as db:
              db.execute(schema, prepare=False)
          PY
      - name: Test preregistration, workload, and PostgreSQL contract
        run: python -m unittest discover -s experiments/e002/t16 -p "test_*.py" -v
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
      - name: Test Go product server against PostgreSQL
        run: go test ./...
        working-directory: experiments/e002/go
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Test Rust product candidate
        run: cargo test --locked
        working-directory: experiments/e002/rust
      - name: Test open-loop T16 product workload generator
        run: go test ./...
        working-directory: experiments/e002/t16/loadgen
      - name: Vet and build open-loop T16 product workload generator
        run: |
          go vet ./...
          go build -o "$RUNNER_TEMP/t16-loadgen" .
        working-directory: experiments/e002/t16/loadgen
