name: task-acceptance

# Acceptance executes code supplied by the PR. Use pull_request (not pull_request_target)
# and never persist checkout credentials into the untrusted worktree.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [research/reboot-core]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head (for acceptance script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Extract task or research issue reference
        id: task
        env:
          PR_BODY: \${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          TASK="$(printf '%s\n' "$PR_BODY" | sed -nE 's/^Task:[[:space:]]*(T[0-9]{2})[[:space:]]*$/\1/p' | head -n 1)"
          RESEARCH_ISSUE="$(printf '%s\n' "$PR_BODY" | sed -nE 's/^Research issue:[[:space:]]*#([1-9][0-9]*)[[:space:]]*$/\1/p' | head -n 1)"
          if [[ -n "$TASK" ]]; then
            echo "type=task" >> "$GITHUB_OUTPUT"
            echo "id=$TASK" >> "$GITHUB_OUTPUT"
          elif [[ -n "$RESEARCH_ISSUE" ]]; then
            echo "type=research" >> "$GITHUB_OUTPUT"
            echo "id=$RESEARCH_ISSUE" >> "$GITHUB_OUTPUT"
          else
            echo "PR body needs Task: Txx or Research issue: #N"
            exit 1
          fi

      - name: Build task acceptance context
        id: context
        uses: actions/github-script@v7
        env:
          TASK_ID: \${{ steps.task.outputs.id }}
          TASK_TYPE: \${{ steps.task.outputs.type }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const pr = context.payload.pull_request;
            const taskId = process.env.TASK_ID;
            const taskType = process.env.TASK_TYPE;
            const expectedPath = 'acceptance/' + taskId + '.sh';

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            const changedPaths = files.map(file => file.filename);
            let acceptanceContext;

            if (taskType === 'task') {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'v1',
                state: 'all',
                per_page: 100
              });
              const issue = issues.find(item =>
                !item.pull_request && item.title.startsWith('[' + taskId + ']')
              );
              if (!issue) {
                core.setFailed('No v1 issue titled [' + taskId + '] ... was found.');
                return;
              }
              const labels = issue.labels.map(label =>
                typeof label === 'string' ? label : label.name
              );
              let hasAcceptance = false;
              try {
                await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: expectedPath,
                  ref: pr.head.sha
                });
                hasAcceptance = true;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              acceptanceContext = {
                task_id: taskId,
                issue_labels: labels,
                changed_paths: changedPaths,
                has_acceptance: hasAcceptance
              };
            } else {
              const issueNumber = Number(taskId);
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              if (issue.pull_request) {
                core.setFailed('Research issue reference points to a pull request, not an issue.');
                return;
              }
              const labels = issue.labels.map(label =>
                typeof label === 'string' ? label : label.name
              );
              const issueBody = issue.body || '';
              acceptanceContext = {
                task_id: null,
                research_issue: {
                  number: issue.number,
                  title: issue.title,
                  state: issue.state,
                  labels,
                  has_goal: /^## Goal\s*$/m.test(issueBody),
                  has_acceptance: /^## Acceptance\s*$/m.test(issueBody)
                },
                changed_paths: changedPaths
              };
            }
            const contextPath = path.join(process.env.RUNNER_TEMP, 'task-acceptance-context.json');
            fs.writeFileSync(contextPath, JSON.stringify(acceptanceContext));
            core.setOutput('context_path', contextPath);

      - name: Select acceptance mode
        id: mode
        working-directory: pr
        env:
          CONTEXT_FILE: ${{ steps.context.outputs.context_path }}
        shell: bash
        run: |
          set -euo pipefail
          mode="$(python3 scripts/task_acceptance.py --context-file "$CONTEXT_FILE")"
          echo "Selected acceptance mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Run and evaluate acceptance script or research test suites
        working-directory: pr
        env:
          TASK_ID: \${{ steps.task.outputs.id }}
          ACCEPTANCE_MODE: \${{ steps.mode.outputs.mode }}
          CONTEXT_FILE: \${{ steps.context.outputs.context_path }}
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="acceptance/$TASK_ID.sh"

          if [[ "$ACCEPTANCE_MODE" == "skip-process" ]]; then
            python3 scripts/task_acceptance.py --mode "$ACCEPTANCE_MODE" --exit-code 0
            exit 0
          fi

          if [[ "$ACCEPTANCE_MODE" == "research-ci" ]]; then
            set +e
            python3 - "$CONTEXT_FILE" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          context = json.load(open(sys.argv[1], encoding="utf-8"))
          paths = context.get("changed_paths", [])
          is_test = lambda path: (
              path.startswith("tests/")
              or "/tests/" in path
              or Path(path).name.startswith("test_")
              or path.endswith(("_test.py", "_test.go"))
          )
          roots = sorted({
              str(Path(path).parent)
              for path in paths
              if is_test(path) and Path(path).is_file()
          })
          if not roots:
              raise SystemExit("No changed test files are present at the PR head.")
          result = 0
          for root in roots:
              completed = subprocess.run([
                  sys.executable, "-m", "unittest", "discover",
                  "-s", root, "-p", "test*.py", "-v"
              ], check=False)
              result = max(result, completed.returncode)
          raise SystemExit(result)
          PY
            script_status=$?
            set -e
            python3 scripts/task_acceptance.py --mode "$ACCEPTANCE_MODE" --exit-code "$script_status"
            exit 0
          fi

          if [[ ! -f "$SCRIPT" ]]; then
            echo "Missing $SCRIPT in PR head"
            exit 1
          fi

          set +e
          bash "$SCRIPT"
          script_status=$?
          set -e

          python3 scripts/task_acceptance.py \
            --mode "$ACCEPTANCE_MODE" \
            --exit-code "$script_status"
