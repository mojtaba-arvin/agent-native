name: task-acceptance

# Acceptance executes code supplied by the PR. Use pull_request (not pull_request_target)
# and never persist checkout credentials into the untrusted worktree.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [research/reboot-core]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head (for acceptance script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Extract Task ID
        id: task
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          TASK="$(printf '%s\n' "$PR_BODY" | sed -nE 's/^Task:[[:space:]]*(T[0-9]{2})[[:space:]]*$/\1/p' | head -n 1)"
          if [[ -z "$TASK" ]]; then
            echo "No Task: line in PR body"
            exit 1
          fi
          echo "id=$TASK" >> "$GITHUB_OUTPUT"

      - name: Build task acceptance context
        id: context
        uses: actions/github-script@v7
        env:
          TASK_ID: ${{ steps.task.outputs.id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const pr = context.payload.pull_request;
            const taskId = process.env.TASK_ID;
            const expectedPath = 'acceptance/' + taskId + '.sh';

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'v1',
              state: 'all',
              per_page: 100
            });
            const issue = issues.find(item =>
              !item.pull_request && item.title.startsWith('[' + taskId + ']')
            );
            if (!issue) {
              core.setFailed('No v1 issue titled [' + taskId + '] ... was found.');
              return;
            }

            const labels = issue.labels.map(label =>
              typeof label === 'string' ? label : label.name
            );
            let hasAcceptance = false;
            try {
              await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: expectedPath,
                ref: pr.head.sha
              });
              hasAcceptance = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const acceptanceContext = {
              task_id: taskId,
              issue_labels: labels,
              changed_paths: files.map(file => file.filename),
              has_acceptance: hasAcceptance
            };
            const contextPath = path.join(process.env.RUNNER_TEMP, 'task-acceptance-context.json');
            fs.writeFileSync(contextPath, JSON.stringify(acceptanceContext));
            core.setOutput('context_path', contextPath);

      - name: Select acceptance mode
        id: mode
        working-directory: pr
        env:
          CONTEXT_FILE: ${{ steps.context.outputs.context_path }}
        shell: bash
        run: |
          set -euo pipefail
          mode="$(python3 scripts/task_acceptance.py --context-file "$CONTEXT_FILE")"
          echo "Selected acceptance mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Run and evaluate acceptance script
        working-directory: pr
        env:
          TASK_ID: ${{ steps.task.outputs.id }}
          ACCEPTANCE_MODE: ${{ steps.mode.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="acceptance/$TASK_ID.sh"

          if [[ "$ACCEPTANCE_MODE" == "skip-process" ]]; then
            python3 scripts/task_acceptance.py --mode "$ACCEPTANCE_MODE" --exit-code 0
            exit 0
          fi

          if [[ ! -f "$SCRIPT" ]]; then
            echo "Missing $SCRIPT in PR head"
            exit 1
          fi

          set +e
          bash "$SCRIPT"
          script_status=$?
          set -e

          python3 scripts/task_acceptance.py \
            --mode "$ACCEPTANCE_MODE" \
            --exit-code "$script_status"

      - name: Upload T18 PostgreSQL pilot evidence
        if: always() && steps.task.outputs.id == 'T18'
        uses: actions/upload-artifact@v4
        with:
          name: t18-postgres-pilot-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-native-t18-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
