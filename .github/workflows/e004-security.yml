name: E-004 capability model checks

on:
  pull_request:
    paths:
      - "experiments/e004/**"
      - ".github/workflows/e004-security.yml"
  push:
    branches:
      - main
      - "research/**"
    paths:
      - "experiments/e004/**"
      - ".github/workflows/e004-security.yml"

permissions:
  contents: read

jobs:
  reference-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - run: python -m unittest discover -s experiments/e004 -v
