name: E-008 outbox and inbox semantics

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - "experiments/e008/**"
      - ".github/workflows/e008-outbox.yml"
  push:
    branches:
      - main
      - "research/**"
    paths:
      - "experiments/e008/**"
      - ".github/workflows/e008-outbox.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sqlite-outbox-inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - run: python -m unittest discover -s experiments/e008 -v
