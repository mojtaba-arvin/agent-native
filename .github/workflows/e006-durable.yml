name: E-006 durable execution checks

on:
  pull_request:
    paths:
      - "experiments/e006/**"
      - ".github/workflows/e006-durable.yml"
  push:
    branches:
      - main
      - "research/**"
    paths:
      - "experiments/e006/**"
      - ".github/workflows/e006-durable.yml"

permissions:
  contents: read

jobs:
  sqlite-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - run: python -m unittest discover -s experiments/e006 -v
