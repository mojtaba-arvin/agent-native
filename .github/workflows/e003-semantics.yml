name: E-003 semantics model

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - "experiments/e003/**"
      - ".github/workflows/e003-semantics.yml"
  push:
    branches:
      - main
      - "research/**"
    paths:
      - "experiments/e003/**"
      - ".github/workflows/e003-semantics.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic semantics tests
        run: python -m unittest discover -s experiments/e003 -v
