name: Agent Native pilot protocol checks

on:
  pull_request:
    paths:
      - "experiments/pilot/**"
      - "experiments/e005/**"
      - "experiments/e001/prototype/**"
      - "experiments/e001/examples/catalog.an"
      - ".github/workflows/agent-native-pilot.yml"
  push:
    branches:
      - main
      - "research/**"
    paths:
      - "experiments/pilot/**"
      - "experiments/e005/**"
      - "experiments/e001/prototype/**"
      - "experiments/e001/examples/catalog.an"
      - ".github/workflows/agent-native-pilot.yml"

permissions:
  contents: read

jobs:
  pilot-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - name: Validate E-001 service representation
        run: python -m unittest discover -s experiments/e001/prototype -v
      - name: Validate E-005 agent interface
        run: python -m unittest discover -s experiments/e005 -v
      - name: Validate pilot disclosure surfaces and gateway
        run: python -m unittest discover -s experiments/pilot -v
