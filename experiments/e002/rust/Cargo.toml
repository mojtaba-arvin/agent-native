[package]
name = "agent-native-e002-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "=1.12.1"
futures-util = "=0.3.34"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tokio-postgres = "=0.7.15"
uuid = { version = "=1.18.1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["io-util"] }
